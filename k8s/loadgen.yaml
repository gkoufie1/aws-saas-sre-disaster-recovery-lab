apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: datareliability
  labels: { app.kubernetes.io/name: loadgen }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: loadgen }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loadgen }
    spec:
      # Keep the synthetic client off the app workers so a worker-node
      # failure does not also kill the thing measuring it.
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
      containers:
        - name: loadgen
          image: datareliability-loadgen:1.0.1
          imagePullPolicy: IfNotPresent
          env:
            - { name: TARGET_URL, value: "http://datareliability-api" }
            - { name: RPS, value: "10" }
          ports: [{ containerPort: 9100, name: metrics }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: loadgen
  namespace: datareliability
  labels: { app.kubernetes.io/name: loadgen }
spec:
  selector: { app.kubernetes.io/name: loadgen }
  ports: [{ name: metrics, port: 9100, targetPort: 9100 }]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: loadgen
  namespace: datareliability
  labels: { release: kube-prometheus-stack }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: loadgen }
  endpoints: [{ port: metrics, interval: 15s }]
