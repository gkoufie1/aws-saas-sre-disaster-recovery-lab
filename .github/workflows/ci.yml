name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: API lint + integration tests
    runs-on: ubuntu-latest
    # A real PostgreSQL, because the class of bug in scenario 04 (SQL that
    # does not match the schema) passes readiness probes and unit mocks.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: customers
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d customers"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: localhost
      DB_NAME: customers
      DB_USER: app
      DB_PASSWORD: ci-only-password
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../lab.py ../loadgen
      - run: pytest -v

  charts:
    name: Helm lint + render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.1
      - run: helm lint charts/datareliability-api charts/datareliability-observability
      - run: |
          helm template api charts/datareliability-api > /dev/null
          helm template obs charts/datareliability-observability > /dev/null

  terraform:
    name: Terraform fmt / validate / IaC scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      # Hard fail on any new finding. Accepted exceptions are inline
      # `#checkov:skip=` comments with a reason, listed in docs/security/iac-scan.md.
      - name: Checkov
        run: |
          pip install checkov==3.2.400
          checkov -d . --framework terraform --quiet --compact --skip-path .terraform

  images:
    name: Build + vulnerability scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [app, loadgen, backup]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -t datareliability-${{ matrix.image }}:ci ${{ matrix.image }}
      # Trivy from its pinned container image rather than a mutable action tag.
      - name: Trivy (fail on fixable CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --exit-code 1 --ignore-unfixed \
            --severity CRITICAL datareliability-${{ matrix.image }}:ci
